[project]
name = "aimai-workflows"
version = "0.1.0"
description = "Stateful agent workflows: a durable LangGraph flow with human-in-the-loop, the same flow across four stacks, and a framework-free DAG runner"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "fport" }]
keywords = [
    "langgraph",
    "human-in-the-loop",
    "durable-execution",
    "checkpointer",
    "workflow-orchestration",
    "dag",
    "agents",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aimai-kit>=1.0.1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The service half of stage 06. Importing `aimai_workflows.contract.api`
# needs these; the graph itself does not.
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.2",
]
# Stage 07 compares four orchestration stacks. Two of them are third-party
# frameworks; nothing else in the package imports them, so a reader who only
# wants stages 06 and 08 does not pay for them.
stacks = [
    "pydantic-ai>=2.0",
    "openai-agents>=0.2",
    "strands-agents>=1.55",
]
providers = ["aimai-kit[providers]>=1.0.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]

[project.scripts]
dagrun = "aimai_workflows.dagrun.__main__:main"
stack-bench = "aimai_workflows.stacks.bench:main"

[project.urls]
Homepage = "https://github.com/fport/aimai-workflows"
Repository = "https://github.com/fport/aimai-workflows"
Documentation = "https://github.com/fport/aimai-workflows/tree/main/docs"
Issues = "https://github.com/fport/aimai-workflows/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimai_workflows"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "fixtures", "prompts", "web", "docs", "assets", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live and not postgres'"
markers = [
    "live: calls a real provider API; excluded from the default run",
    "postgres: needs a running PostgreSQL; excluded from the default run",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The generator embeds SVG markup in f-strings; wrapping those lines would
# make the output harder to read, not easier.
"assets/_generate.py" = ["E501"]
